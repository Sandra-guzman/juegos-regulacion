<style>

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

.mk{font-weight:700} .mk.ok{color:var(--ok)} .mk.no{color:var(--bad)}

.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
th{font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.r,th.r{text-align:right;font-family:var(--mono)}
tr.me td{background:var(--goldbg)}
.rk{font:600 13px var(--mono);color:var(--muted);width:28px}

.banner{border:1px solid var(--gold);background:var(--goldbg);padding:9px 12px;border-radius:4px;font-size:13.5px}

@media (prefers-reduced-motion:no-preference){.stamp{animation:pop .25s ease-out}@keyframes pop{from{transform:scale(1.4) rotate(-2.5deg);opacity:0}}}

</head><body><main><header><div class="eyebrow">Mercados Financieros Globales · Sesión 6</div><h1>Mesa de Cumplimiento</h1><p class="lede">Eres el oficial de cumplimiento de una entidad financiera y administras un presupuesto. Cada decisión correcta lo hace crecer; cada error cuesta una multa. Cada pista también cuesta.</p></header><div id="app"></div><p class="muted small"><a href="index.html" style="color:var(--navy)">← Todos los juegos</a></p></main><script>
/* ===== Utilidades de contenido ===== */
function rnd(){return Math.random()}
function ri(a,b,st){st=st||1;return a+st*Math.floor(rnd()*(Math.floor((b-a)/st)+1))}
function pick(a){return a[Math.floor(rnd()*a.length)]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(rnd()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function nf(x,d){return new Intl.NumberFormat("es-CO",{minimumFractionDigits:d||0,maximumFractionDigits:d||0}).format(x)}
function M(x){return "$"+nf(x,0)+" M"}

/* mcq: opts = [texto, correcta(bool), porqué-falla] */
function mcq(id,b,slide,label,text,opts,exp,hint2,o){
  o=o||{};
  return {id:id,b:b,slide:slide,label:label,type:"mcq",tf:!!o.tf,spot:!!o.spot,text:text,opts:opts.map(function(x){return{t:x[0],ok:!!x[1],why:x[2]||""}}),exp:exp,hint2:hint2,shuffle:o.shuffle!==false};
}
function ordq(id,b,slide,label,text,items,exp,hint2){return {id:id,b:b,slide:slide,label:label,type:"order",text:text,items:items,exp:exp,hint2:hint2}}
function matq(id,b,slide,label,text,pairs,exp,hint2){return {id:id,b:b,slide:slide,label:label,type:"match",text:text,pairs:pairs,exp:exp,hint2:hint2}}

var POOL={N:[],I:[],D:[],T:[]};

/* ======= BLOQUE 1 · MARCO NACIONAL ======= */
POOL.N.push(function(){return mcq("N1","N",6,"Quién fija la tasa de intervención","El 30 de septiembre de 2026 se subió la tasa de intervención a 12,25%. ¿Qué entidad toma esa decisión?",[

 "La Junta Directiva del BanRep fija la tasa de intervención, con autonomía constitucional.","Piense en quién tiene autonomía constitucional (arts. 371-373).")});
POOL.N.push(function(){return mcq("N2","N",6,"Base de la autonomía del BanRep","¿Qué normas dan al Banco de la República su autonomía frente al Gobierno?",[

 "La autonomía viene de la Constitución y de la Ley 31/1992: es la norma de más alto rango, y por eso el Ejecutivo no puede ordenarle a la Junta qué tasa fijar.","Es una norma de rango constitucional.")});
POOL.N.push(function(){return mcq("N3","N",7,"Qué es el AMV","¿Qué entidad certifica a los operadores de bolsa, vigila su conducta y sanciona malas prácticas antes que la SFC?",[

POOL.N.push(function(){return mcq("N4","N",7,"La Circular Externa 004","¿Qué cambió con la Circular Externa 004 de 2026, vigente desde el 1 de junio?",[

POOL.N.push(function(){
  var all=[{l:"Congreso de la República",r:"Expide las leyes marco"},{l:"Banco de la República",r:"Política monetaria y tasa de interés"},{l:"Superintendencia Financiera",r:"Supervisa bancos, bolsa, seguros y pensiones"},{l:"AMV",r:"Autorregula a los intermediarios del mercado"},{l:"Fogafín",r:"Asegura los depósitos del ahorrador"}];
  return matq("N7","N",5,"Quién hace qué","Una cada entidad con su función.",shuffle(all).slice(0,4),"Crea las reglas (Congreso), las aplica (BanRep, SFC), y opera y protege (AMV, Fogafín).","Recuerde: crea, aplica, opera y protege.")});

  exp:"Cada entidad se evalúa por separado: repartir el dinero entre bancos aumenta la cobertura.",hint2:"El tope se aplica por entidad, no al total."}});

  diag:function(v){if(v===Math.floor(X/50))return "Redondeaste hacia abajo: con ese número de bancos, cada uno quedaría con más de $50 M y parte quedaría sin cubrir.";return null},

  var all=[{l:"Monetario",r:"Banco de la República"},{l:"Capitales",r:"SFC · AMV · BVC"},{l:"Divisas",r:"BanRep · SFC"},{l:"Derivados",r:"SFC · CRCC"},{l:"Materias primas",r:"SFC · BMC"}];

 "El AMV es una entidad PRIVADA con función pública, no estatal.","Una de las cuatro mezcla 'privado' con 'estatal'.",{spot:true})});

var $app=document.getElementById("app");
var BLOCK={N:"Marco nacional",I:"Internacional",D:"Activos digitales",T:"Tablero"};
var HINT1=3,HINT2=5,START=100,NR=15,STREAK_BONUS=2;
var DB=null,USER=null,UID=null,IS_OWNER=false,CAN_WRITE=null,ROWS=[],DBERR="",SOLO=true;
var S={view:"home",name:"",team:"",rounds:[],i:0,budget:START,streak:0,best:0,right:0,log:[],q:null,stake:10,h1:false,h2:false,done:false,res:null,ui:{},confirmReset:false};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

function build(){
  var plan={N:6,I:4,D:3,T:2},out=[];
  Object.keys(plan).forEach(function(b){shuffle(POOL[b]).slice(0,plan[b]).forEach(function(f){out.push(f())})});
  return shuffle(out);
}
function start(){
  S.rounds=build();S.i=0;S.budget=START;S.streak=0;S.best=0;S.right=0;S.log=[];S.done=false;S.res=null;
  S.view="play";next(true);
}
function next(first){
  if(!first)S.i++;
  if(S.i>=S.rounds.length||S.budget<=0)return finish();
  var q=S.rounds[S.i];S.q=q;S.h1=false;S.h2=false;S.res=null;S.stake=Math.min(10,Math.max(5,S.budget>=10?10:5));
  S.ui={sel:null,val:"",placed:[],gone:[],match:{},hintMatch:null};
  if(q.type==="order"){S.ui.shuf=shuffle(q.items.map(function(x,k){return k}))}
  if(q.type==="match"){S.ui.rights=shuffle(q.pairs.map(function(p){return p.r}))}
  if(q.type==="mcq"&&q.shuffle)q.opts=shuffle(q.opts);
  render();
}
function mult(){return S.h1&&S.h2?0.25:(S.h1||S.h2?0.5:1)}
function spendHint(n){
  var c=n===1?HINT1:HINT2;if(S.budget<c||S.res)return;S.budget-=c;
  if(n===1){S.h1=true;var q=S.q;
    if(q.type==="mcq"&&!q.tf){var w=q.opts.map(function(o,k){return o.ok?-1:k}).filter(function(k){return k>=0});S.ui.gone=shuffle(w).slice(0,2)}
    if(q.type==="order"){S.ui.placed=[0]}
    if(q.type==="match"){S.ui.hintMatch=q.pairs[0].l;S.ui.match[q.pairs[0].l]=q.pairs[0].r}
  }else S.h2=true;
  render();
}
function checkAnswer(){
  var q=S.q,ok=false,detail="";
  if(q.type==="mcq"){var o=q.opts[S.ui.sel];ok=o.ok;detail=ok?"":o.why;S.ui.picked=S.ui.sel}
  else if(q.type==="calc"){
    var raw=String(S.ui.val).trim().replace(/\s/g,"").replace("%","");
    if(raw.indexOf(",")>-1&&raw.indexOf(".")>-1)raw=raw.replace(/\./g,"");
    var v=parseFloat(raw.replace(",","."));if(!isFinite(v))return;
    ok=Math.abs(v-q.ans)<=q.tol;S.ui.entered=v;
    if(!ok){detail=(q.diag&&q.diag(v))||"Tu respuesta ("+nf(v,2)+") no coincide con "+nf(q.ans,2)+". Revisa la fórmula y cada paso."}
  }else if(q.type==="order"){
    var pl=S.ui.placed;ok=pl.every(function(k,p){return k===p});
    if(!ok){var bad=pl.map(function(k,p){return k===p?-1:p}).filter(function(p){return p>=0});detail="Pusiste mal "+bad.length+" de "+pl.length+" posiciones."}
  }else if(q.type==="match"){
    var wrong=q.pairs.filter(function(p){return S.ui.match[p.l]!==p.r});ok=wrong.length===0;
    detail=ok?"":"Fallaste "+wrong.length+" de "+q.pairs.length+" parejas: "+wrong.map(function(p){return "«"+p.l+"»"}).join(", ")+".";
  }
  var m=mult(),delta;
  if(ok){S.streak++;delta=Math.round(S.stake*m*100)/100;
    var bonus=(S.streak>=3&&!S.h1&&!S.h2)?STREAK_BONUS:0;delta+=bonus;S.budget+=delta;S.right++;S.res={ok:true,delta:delta,bonus:bonus}}
  else{S.streak=0;delta=-S.stake;S.budget=Math.max(0,S.budget+delta);S.res={ok:false,delta:delta,detail:detail};
    S.log.push({id:q.id,b:q.b,label:q.label,slide:q.slide,detail:detail,exp:q.exp})}
  S.best=Math.max(S.best,S.budget);
  render();
}
function tier(b){return b>=160?["Oficial de Cumplimiento Senior","Regulador de pies a cabeza."]:b>=125?["Oficial de Cumplimiento","Cuentas claras y presupuesto sano."]:b>=90?["Analista de Riesgos","Cumples, pero aún dejas dinero en la mesa."]:b>0?["Aprendiz","Hubo multas costosas: repasa el reporte de errores."]:["Entidad intervenida","La SFC tomó el control: quedaste sin presupuesto."]}
function finish(){
  S.done=true;S.view="end";var sc=Math.round(S.budget*10)/10;
  S.final=sc;saveResult(sc);render();
}

/* ===== Persistencia (db) ===== */
var writing=false,pending=null;
function saveResult(sc){
  if(!DB||!UID)return;
  var errs={};S.log.forEach(function(e){errs[e.id]=(errs[e.id]||0)+1});
  var mine=ROWS.filter(function(r){return r.id===UID})[0]||{};
  var prev=mine.errs||{};Object.keys(errs).forEach(function(k){prev[k]=(prev[k]||0)+errs[k]});
  var seen=mine.seen||{};S.rounds.slice(0,S.i+(S.budget>0?0:1)).forEach(function(q){seen[q.id]=(seen[q.id]||0)+1});
  pending={name:S.name,team:S.team,best:Math.max(mine.best||0,sc),last:sc,games:(mine.games||0)+1,right:(mine.right||0)+S.right,errs:prev,seen:seen,t:Date.now()};
  flush();
}
function flush(){
  if(writing||!pending)return;writing=true;var d=pending;pending=null;
  DB.doc("jugadores/"+UID).set(d).then(function(){DBERR=""}).catch(function(e){DBERR="No se pudo guardar tu puntaje en el ranking ("+((e&&e.code)||"error")+"). Pide al docente acceso de Colaborador."}).then(function(){writing=false;if(pending)flush();else render()});
}
function register(){
  var n=S.name.trim();if(!n)return;ls("mc_name",n);ls("mc_team",S.team);
  if(DB&&UID&&CAN_WRITE!==false){DB.doc("jugadores/"+UID).update({name:n,team:S.team,t:Date.now()}).catch(function(){
    return DB.doc("jugadores/"+UID).set({name:n,team:S.team,best:0,last:0,games:0,right:0,errs:{},seen:{},t:Date.now()})}).catch(function(){})}
  start();
}

/* ===== Vistas ===== */
function fmtM(x){return "$"+nf(x,Math.abs(x%1)>0.001?1:0)+" M"}
function hud(){
  var b=S.budget,cls=b<30?"low":(b<60?"mid":"");
  return '<div class="hud"><div class="bud"><div class="k">Presupuesto</div><div class="v">'+fmtM(b)+'</div><div class="bar"><i class="'+cls+'" style="width:'+Math.min(100,b/1.6)+'%"></i></div></div>'+
   '<div><div class="k">Ronda</div><div class="v">'+Math.min(S.i+1,NR)+'/'+NR+'</div></div>'+
   '<div><div class="k">Racha</div><div class="v">'+S.streak+'</div></div>'+
   '<div><div class="k">Aciertos</div><div class="v">'+S.right+'</div></div></div>';
}
function home(){
  var tm=["Equipo A","Equipo B","Equipo C","Equipo D","Equipo E","Equipo F"];
  return '<div class="card stack"><h2>Registro</h2>'+
   '<label class="f"><b>Tu nombre</b><input type="text" id="nm" maxlength="30" autocomplete="off" value="'+esc(S.name)+'"></label>'+
   '<label class="f"><b>Tu equipo</b><select id="tm">'+tm.map(function(t){return '<option'+(S.team===t?" selected":"")+'>'+t+'</option>'}).join("")+'</select></label>'+
   '<button class="primary" id="go"'+(S.name.trim()?"":" disabled")+'>Entrar a la mesa</button>'+
   '<h3>Reglas</h3><ul class="rules">'+
   '<li>Empiezas con <b>$100 M</b>. Son '+NR+' rondas de preguntas de la Sesión 6.</li>'+
   '<li>Antes de responder, <b>apuestas</b> $5, $10 o $20 M. Si aciertas, ganas la apuesta; si fallas, la pierdes.</li>'+
   '<li>Las pistas cuestan: <b>pista 1 = $'+HINT1+' M</b>, <b>pista 2 = $'+HINT2+' M</b>, y además <b>reducen lo que ganas</b> (×0,5 con una, ×0,25 con las dos).</li>'+
   '<li>Racha de 3 aciertos seguidos sin pistas: <b>+$'+STREAK_BONUS+' M</b> por ronda.</li>'+
   '<li>Si llegas a $0, la SFC interviene y se acaba el juego. Gana quien termine con más presupuesto.</li></ul></div>';
}
function qBody(){
  var q=S.q,r=S.res,h='';
  if(q.type==="mcq"){
    h+='<div class="opts">'+q.opts.map(function(o,k){
      var c="opt",L=String.fromCharCode(65+k)+".";
      if(!r&&S.ui.gone.indexOf(k)>-1)c+=" gone";
      if(r){if(o.ok)c+=" right";else if(S.ui.picked===k)c+=" wrong"}
      return '<button class="'+c+'" data-o="'+k+'"'+(r||S.ui.gone.indexOf(k)>-1?" disabled":"")+(S.ui.sel===k&&!r?' style="border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)"':"")+'><span class="l">'+(q.tf?(k?"F":"V"):L)+'</span><span>'+esc(o.t)+'</span></button>'}).join("")+'</div>';
  }else if(q.type==="calc"){
    h+='<div class="numrow"><input type="text" id="num" inputmode="decimal" autocomplete="off" placeholder="Tu cifra" value="'+esc(S.ui.val)+'"'+(r?" disabled":"")+'><span class="muted small">'+esc(q.unit)+'</span></div>';
    if(S.h1||r)h+='<div class="hint"><b>Fórmula:</b> '+esc(q.formula)+'</div>';
  }else if(q.type==="order"){
    var pl=S.ui.placed,left=S.ui.shuf.filter(function(k){return pl.indexOf(k)<0});
    h+='<div class="slots">'+q.items.map(function(_,p){var k=pl[p];var st=r&&k!==undefined?(k===p?"border-color:var(--ok)":"border-color:var(--bad)"):"";
      return '<div class="slot" style="'+st+'"><span class="n">'+(p+1)+'</span>'+(k!==undefined?'<button data-rm="'+p+'"'+(r||(S.h1&&p===0)?" disabled":"")+' style="border-color:var(--line);color:var(--fg);font-weight:500;text-align:left">'+esc(q.items[k].t)+'</button>':'<span class="muted small">—</span>')+'</div>'}).join("")+'</div>';
    if(!r)h+='<div class="pool">'+left.map(function(k){return '<button data-pl="'+k+'">'+esc(q.items[k].t)+'</button>'}).join("")+'</div>';
  }else if(q.type==="match"){
    h+='<div class="pairs">'+q.pairs.map(function(p){var v=S.ui.match[p.l]||"";var locked=r||S.ui.hintMatch===p.l;
      var st=r?(v===p.r?"border-color:var(--ok)":"border-color:var(--bad)"):"";
      return '<div class="pair"><div class="lft">'+esc(p.l)+'</div><select data-m="'+esc(p.l)+'"'+(locked?" disabled":"")+' style="'+st+'"><option value="">— elige —</option>'+S.ui.rights.map(function(x){return '<option'+(x===v?" selected":"")+'>'+esc(x)+'</option>'}).join("")+'</select></div>'}).join("")+'</div>';
  }
  return h;
}
function canCheck(){
  var q=S.q;
  if(q.type==="mcq")return S.ui.sel!==null;
  if(q.type==="calc")return String(S.ui.val).trim()!=="";
  if(q.type==="order")return S.ui.placed.length===q.items.length;
  return q.pairs.every(function(p){return S.ui.match[p.l]});
}
function feedback(){
  var q=S.q,r=S.res,h='<div class="fb '+(r.ok?"ok":"no")+'"><div class="stamp">'+(r.ok?"Aprobado":"Multa")+'</div>'+
   '<div class="delta '+(r.ok?"up":"dn")+'">'+(r.delta>0?"+":"−")+fmtM(Math.abs(r.delta)).replace("$","$")+(r.bonus?" (incluye racha +$"+r.bonus+" M)":"")+(r.ok&&mult()<1?" · reducido por pistas ×"+nf(mult(),2):"")+'</div>';
  if(!r.ok){
    h+='<div class="why"><b>Por qué fallaste:</b> '+esc(r.detail||"")+'</div>';
    if(q.type==="order")h+='<div class="why"><b>Orden correcto:</b><ol class="steps">'+q.items.map(function(x){return '<li>'+esc(x.t)+' — <span class="muted">'+esc(x.n)+'</span></li>'}).join("")+'</ol></div>';
    if(q.type==="match")h+='<div class="why"><b>Parejas correctas:</b><ul>'+q.pairs.map(function(p){return '<li>'+esc(p.l)+' → '+esc(p.r)+'</li>'}).join("")+'</ul></div>';
    if(q.type==="mcq")h+='<div class="why"><b>Respuesta correcta:</b> '+esc(q.opts.filter(function(o){return o.ok})[0].t)+'</div>';
    if(q.type==="calc")h+='<div class="why"><b>Cómo se resuelve:</b><ol class="steps">'+q.steps.map(function(s){return '<li>'+esc(s)+'</li>'}).join("")+'</ol></div>';
  }
  h+='<div><b>Idea clave:</b> '+esc(q.exp)+'</div>';
  var last=S.budget<=0||S.i>=S.rounds.length-1;
  h+='<button class="primary" id="nx" style="align-self:flex-start">'+(last?"Ver resultado":"Siguiente ronda")+'</button></div>';
  return h;
}
function play(){
  var q=S.q,r=S.res,h=hud()+'<div class="card stack"><div class="qhead"><span class="tag">'+BLOCK[q.b]+' · '+(q.type==="calc"?"Cálculo":q.type==="order"?"Ordenar":q.type==="match"?"Emparejar":q.spot?"Caza el error":q.tf?"Verdadero / Falso":"Selección")+'</span><span class="muted small mono">Ronda '+(S.i+1)+'</span></div><div class="q">'+esc(q.text)+'</div>';
  if(!r){
    var mx=Math.min(20,S.budget);
    h+='<div class="stakes"><span class="muted small">Apuesta:</span>'+[5,10,20].map(function(v){return '<button class="chip" data-st="'+v+'" aria-pressed="'+(S.stake===v)+'"'+(v>S.budget?" disabled":"")+'>$'+v+' M</button>'}).join("")+'</div>';
    h+='<div class="hints"><button class="hbtn" data-h="1"'+(S.h1||S.budget<=HINT1?" disabled":"")+'>Pista 1 · −$'+HINT1+' M</button><button class="hbtn" data-h="2"'+(S.h2||S.budget<=HINT2?" disabled":"")+'>Pista 2 · −$'+HINT2+' M</button><span class="muted small">Cada pista reduce tu premio (hoy ×'+nf(mult(),2)+').</span></div>';
    if(S.h1&&q.type==="mcq"&&q.tf)h+='<div class="hint">Pista 1: lee con cuidado; una sola palabra puede cambiar la respuesta.</div>';
    else if(S.h1&&q.type==="order")h+='<div class="hint">Pista 1: te puse el primer elemento.</div>';
    else if(S.h1&&q.type==="match")h+='<div class="hint">Pista 1: te resolví una pareja.</div>';
    else if(S.h1&&q.type==="mcq")h+='<div class="hint">Pista 1: descarté dos opciones incorrectas.</div>';
    if(S.h2)h+='<div class="hint"><b>Pista 2:</b> '+esc(q.type==="calc"?q.partial:q.hint2)+'</div>';
  }
  h+=qBody();
  if(!r)h+='<button class="primary" id="ck" style="align-self:flex-start"'+(canCheck()?"":" disabled")+'>Responder · apuesto $'+S.stake+' M</button>';
  h+='</div>';
  if(r)h+=feedback();
  return h;
}
function endView(){
  var t=tier(S.final),pct=S.log.length;
  var h='<div class="card stack"><div class="eyebrow">Resultado final</div><div class="big">'+fmtM(S.final)+'</div><h2>'+t[0]+'</h2><p class="muted" style="margin:0">'+t[1]+' Aciertos: '+S.right+' de '+Math.min(S.i+(S.budget>0?0:1),NR)+'.</p></div>';
  if(S.log.length){
    h+='<div class="card stack"><h2>Tu reporte de errores</h2><p class="muted small" style="margin:0">Estos son los conceptos que te costaron dinero. Repásalos con la explicación de cada uno.</p>'+
     S.log.map(function(e){return '<div class="why" style="border:1px solid var(--line);border-radius:4px;padding:10px 12px"><b>'+esc(e.label)+'</b> <span class="muted small">· '+BLOCK[e.b]+'</span><div style="margin-top:4px">'+(e.detail?'<span style="color:var(--bad)">Tu error: '+esc(e.detail)+'</span><br>':'')+esc(e.exp)+'</div></div>'}).join("")+'</div>';
  }else h+='<div class="banner">Sin errores: no pagaste ninguna multa.</div>';
  if(!DB)h+='<div class="banner">Estás en modo individual: tu puntaje no se guarda en el ranking compartido.</div>';
  h+='<div><button class="primary" id="again">Jugar de nuevo</button></div>';
  return h;
}
/* Ranking y panel docente */
function rankView(){
  var rows=ROWS.slice().sort(function(a,b){return (b.best||0)-(a.best||0)});
  var h='<div class="card stack"><h2>Ranking'+(DB?' <span class="live">en vivo</span>':'')+'</h2>';
  if(!DB)h+='<div class="banner">Modo individual. Para ranking compartido, el docente debe compartir el enlace como Colaborador.</div>';
  else if(DBERR)h+='<div class="banner">'+esc(DBERR)+'</div>';
  if(!rows.length)h+='<p class="muted small" style="margin:0">Aún no hay puntajes. Sé el primero.</p>';
  else{
    h+='<div class="tw"><table><thead><tr><th></th><th>Jugador</th><th class="r">Mejor</th></tr></thead><tbody>'+rows.slice(0,15).map(function(r,k){return '<tr class="'+(r.id===UID?"me":"")+'"><td class="rk">'+(k+1)+'</td><td>'+esc(r.name||"—")+'<div class="muted small">'+esc(r.team||"")+' · '+(r.games||0)+' partidas</div></td><td class="r">'+fmtM(r.best||0)+'</td></tr>'}).join("")+'</tbody></table></div>';
    var tm={};rows.forEach(function(r){if(!r.team||!r.games)return;var t=tm[r.team]=tm[r.team]||{s:0,n:0};t.s+=r.best||0;t.n++});
    var tl=Object.keys(tm).map(function(k){return {t:k,v:tm[k].s/tm[k].n,n:tm[k].n}}).sort(function(a,b){return b.v-a.v});
    if(tl.length)h+='<h3>Por equipos <span class="muted small">(promedio)</span></h3><div class="tw"><table><tbody>'+tl.map(function(t,k){return '<tr><td class="rk">'+(k+1)+'</td><td>'+esc(t.t)+' <span class="muted small">('+t.n+')</span></td><td class="r">'+fmtM(t.v)+'</td></tr>'}).join("")+'</tbody></table></div>';
  }
  return h+'</div>';
}
function teacherView(){
  if(!IS_OWNER||!DB)return '';
  var tot={},seen={};ROWS.forEach(function(r){Object.keys(r.errs||{}).forEach(function(k){tot[k]=(tot[k]||0)+r.errs[k]});Object.keys(r.seen||{}).forEach(function(k){seen[k]=(seen[k]||0)+r.seen[k]})});
  var meta={};Object.keys(POOL).forEach(function(b){POOL[b].forEach(function(f){var q=f();meta[q.id]=q})});
  var list=Object.keys(tot).map(function(k){return {id:k,n:tot[k],s:seen[k]||tot[k]}}).sort(function(a,b){return b.n/b.s-a.n/a.s||b.n-a.n}).slice(0,8),mx=1;
  var h='<div class="card stack"><h2>Panel docente</h2><p class="muted small" style="margin:0">'+ROWS.length+' jugadores registrados. Conceptos con más errores (tasa de fallo):</p>';
  if(!list.length)h+='<p class="muted small" style="margin:0">Aún no hay errores registrados.</p>';
  else h+=list.map(function(e){var m=meta[e.id]||{label:e.id,slide:"?"};var pc=Math.min(100,Math.round(100*e.n/e.s));return '<div><div class="small"><b>'+esc(m.label)+'</b> <span class="muted">· '+e.n+'/'+e.s+' fallos'+'</span></div><div class="bk"><div class="bb" style="width:'+pc+'%"></div><span class="mono small">'+pc+'%</span></div></div>'}).join("");
  h+=S.confirmReset?'<div class="banner">¿Borrar TODO el ranking? <button id="rs2" style="margin-left:8px;border-color:var(--bad);color:var(--bad)">Sí, borrar</button> <button id="rs0">Cancelar</button></div>':'<button id="rs1" style="align-self:flex-start">Reiniciar ranking</button>';
  return h+'</div>';
}
function render(){
  var main=S.view==="home"?home():S.view==="play"?play():endView();
  var focus=document.activeElement&&document.activeElement.id;
  $app.innerHTML='<div class="cols"><div class="stack">'+main+'</div><div class="stack">'+rankView()+teacherView()+'</div></div>';
  bind();
  if(focus){var el=document.getElementById(focus);if(el&&el.tagName==="INPUT"){el.focus();try{el.setSelectionRange(el.value.length,el.value.length)}catch(e){}}}
}
function bind(){
  var $=function(s){return $app.querySelector(s)},$$=function(s){return $app.querySelectorAll(s)};
  var nm=$("#nm");if(nm){nm.oninput=function(){S.name=nm.value;$("#go").disabled=!nm.value.trim()};nm.onkeydown=function(e){if(e.key==="Enter"&&nm.value.trim())register()}}
  var tm=$("#tm");if(tm)tm.onchange=function(){S.team=tm.value};
  var go=$("#go");if(go)go.onclick=function(){S.team=$("#tm").value;register()};
  Array.prototype.forEach.call($$("[data-st]"),function(b){b.onclick=function(){S.stake=+b.dataset.st;render()}});
  Array.prototype.forEach.call($$("[data-h]"),function(b){b.onclick=function(){spendHint(+b.dataset.h)}});
  Array.prototype.forEach.call($$("[data-o]"),function(b){b.onclick=function(){S.ui.sel=+b.dataset.o;render()}});
  var num=$("#num");if(num){num.oninput=function(){S.ui.val=num.value;$("#ck").disabled=!num.value.trim()};num.onkeydown=function(e){if(e.key==="Enter"&&num.value.trim())checkAnswer()}}
  Array.prototype.forEach.call($$("[data-pl]"),function(b){b.onclick=function(){S.ui.placed.push(+b.dataset.pl);render()}});
  Array.prototype.forEach.call($$("[data-rm]"),function(b){b.onclick=function(){S.ui.placed.splice(+b.dataset.rm,1);render()}});
  Array.prototype.forEach.call($$("[data-m]"),function(s){s.onchange=function(){S.ui.match[s.dataset.m]=s.value;render()}});
  var ck=$("#ck");if(ck)ck.onclick=checkAnswer;
  var nx=$("#nx");if(nx)nx.onclick=function(){next()};
  var ag=$("#again");if(ag)ag.onclick=start;
  var r1=$("#rs1");if(r1)r1.onclick=function(){S.confirmReset=true;render()};
  var r0=$("#rs0");if(r0)r0.onclick=function(){S.confirmReset=false;render()};
  var r2=$("#rs2");if(r2)r2.onclick=function(){
    var ids=ROWS.map(function(r){return r.id});S.confirmReset=false;
    Promise.all(ids.map(function(id){return DB.doc("jugadores/"+id).delete()})).catch(function(){DBERR="No se pudo borrar el ranking."}).then(render)};
}

/* ===== Arranque: la página funciona sola; el ranking se enciende si hay db ===== */
S.name=ls("mc_name")||"";S.team=ls("mc_team")||"Equipo A";
render();
(async function(){
  try{
    var u=null;try{u=await claude.use("user")}catch(e){}
    var d=null;try{d=await claude.use("db")}catch(e){}
    USER=u;
    if(u){try{UID=await u.id()}catch(e){} try{IS_OWNER=await u.isOwner()}catch(e){} try{CAN_WRITE=await u.can("data.write")}catch(e){}}
    if(d&&UID){
      DB=d;
      DB.collection("jugadores").onSnapshot(function(snap){ROWS=snap.docs.map(function(x){var o=x.data()||{};o.id=x.id;return o});
        var mine=ROWS.filter(function(r){return r.id===UID})[0];if(mine&&!S.name&&mine.name){S.name=mine.name;S.team=mine.team||S.team}
        if(!(S.view==="play"&&document.activeElement&&document.activeElement.id==="num"))render()},
        function(e){DBERR="No se pudo leer el ranking.";render()});
    }
    render();
  }catch(e){render()}
})();

</script></body></html>
